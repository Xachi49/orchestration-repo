services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: orchestrator
      POSTGRES_PASSWORD: orchestrator
      POSTGRES_DB: orchestrator
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orchestrator -d orchestrator"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ORCHESTRATOR_ENV: DEVELOPMENT
      ORCHESTRATOR_STORAGE: postgres
      ORCHESTRATOR_ROLE: API
      ORCHESTRATOR_AUTH_MODE: HEADER_PRINCIPAL
      DATABASE_URL: postgres://orchestrator:orchestrator@postgres:5432/orchestrator
      APPROVAL_DELIVERY_SECRET_KEY: CwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCws=
      ORCHESTRATOR_HTTP_HOST: 0.0.0.0
      ORCHESTRATOR_HTTP_PORT: "3000"
    ports:
      - "3000:3000"

  worker:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ORCHESTRATOR_ENV: DEVELOPMENT
      ORCHESTRATOR_STORAGE: postgres
      ORCHESTRATOR_ROLE: WORKER
      ORCHESTRATOR_AUTH_MODE: HEADER_PRINCIPAL
      DATABASE_URL: postgres://orchestrator:orchestrator@postgres:5432/orchestrator
      APPROVAL_DELIVERY_SECRET_KEY: CwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCws=
